name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and Android version
      description: "Settings → About, for example: v0.0.1 beta-1, Android 15 (or Linux + distro)."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        With the phone connected and w0y running: `adb logcat -d --pid=$(adb shell pidof com.texfi.w0y) > w0y-log.txt`, then paste the file here.
        Remove anything personal first. No log? Say so, it is fine.
      render: text
