name: Build & Release

# Сборка идёт здесь; локально собирается только debug для проверки кода.
#  • пуш тега:        git tag v0.0.1-beta && git push origin v0.0.1-beta
#      → релизный APK + GitHub Release
#  • вручную без тега: вкладка Actions → Run workflow, поле пустое
#      → просто соберёт release APK в артефакты
#  • вручную с тегом:  release_tag = v0.0.1-beta
#      → соберёт, заведёт тег на выбранном коммите и выпустит релиз
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза, например v0.0.1-beta. Пусто — только сборка."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # innertubex приходит с JitPack, и первая сборка версии там может
      # собираться минутами. Кеш Gradle это гасит, но на холодном раннере
      # шаг бывает долгим — это нормально, а не зависание.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/texfi-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/texfi-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета с keystore — сборка уйдёт на debug-ключ, такой APK не раздаём."
          fi

      # Проверки до сборки: lint ловит то, что компилятор пропускает —
      # например, вид, недопустимый в виджете (RemoteViews принимает лишь
      # известный ей список классов, и обычный View в него не входит).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: texfi
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk out/TexFi-w0y-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: texfi-w0y-android
          path: out/TexFi-w0y-android.apk
          if-no-files-found: error

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: TexFi w0y ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          files: dist/**/*.apk
